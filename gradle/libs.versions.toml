# Every version here was checked against minSdk 19 (Android 4.4, Dalvik). See README.md.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
animalsniffer = "2.0.1"
# 3.12.x is the last OkHttp branch that supports Android < 5.
okhttp = "3.12.13"
# 2.6+ requires minSdk 21. Brings TLS 1.2 with AES-GCM/ChaCha20, which KitKat's own provider lacks.
conscrypt = "2.5.3"
junit = "4.13.2"

[libraries]
android-api19-signature = { module = "net.sf.androidscents.signature:android-api-level-19", version = "4.4.2_r4" }
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
